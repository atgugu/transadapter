[project]
name = "transadapter"
version = "0.0.1"
description = "Small-model program testing whether shared latent + adaptive depth + feedback compute better together"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "einops>=0.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "datasets>=2.20",
    "tokenizers>=0.20",
    "wandb>=0.18",
    "huggingface-hub>=0.24",
]
mechinterp = [
    "transformer-lens>=2.0",
    "sae-lens>=4.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transadapter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
